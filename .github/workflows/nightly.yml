name: Nightly Jazz Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: Install Python packages
        run: pip install requests beautifulsoup4 lxml anthropic python-dateutil playwright
      - name: Install Chromium
        run: playwright install chromium --with-deps
      - name: Scrape
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_all.py
      - name: Check description coverage
        run: |
          python3 -c "
import json, sys
from datetime import datetime
today = datetime.now().strftime('%Y-%m-%d')
gigs = json.load(open('data/gigs.json'))
future = [g for g in gigs if g.get('date','') >= today]
no_desc = [g for g in future if not g.get('description','').strip()]
pct = int(100*(len(future)-len(no_desc))/max(len(future),1))
print(f'Description coverage: {len(future)-len(no_desc)}/{len(future)} ({pct}%)')
if pct < 30:
    print(f'WARNING: Only {pct}% of future gigs have descriptions')
"
        continue-on-error: true
      - name: Safety check — abort if gigs.json empty
        run: |
          COUNT=$(python3 -c "import json; d=json.load(open('data/gigs.json')); print(len(d))" 2>/dev/null || echo 0)
          echo "Gig count after scrape: $COUNT"
          if [ "$COUNT" -lt 50 ]; then
            echo "ERROR: Only $COUNT gigs — aborting to prevent data loss"
            exit 1
          fi
      - name: Copy data to root
        run: cp data/*.json .
      - name: Pre-render gigs.html
        run: python prerender.py
      - name: Update sitemap
        run: python update_sitemap.py
        continue-on-error: true
      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Jazz Scraper Bot"
          git add -A
          git diff --staged --quiet || git commit -m "Auto: nightly scrape $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
